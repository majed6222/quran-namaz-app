select,input[type=text],input[type=search],input[type=number],textarea{padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);max-width:100%}
textarea{width:100%;min-height:80px}

    <input type="range" id="plSeek" min="0" max="100" value="0" step="0.1" aria-label="অডিও সিক বার">

  </div>
  <div class="pc">
    <button class="btn alt" id="plPrev" aria-label="আগের আয়াত">⏮</button>

<script>
'use strict';
/* =========================================================
   পবিত্র আল-কুরআন ও নামাজ শিক্ষা — একক HTML ফাইল
   ডেটা: Quran.com API v4 (আরবি/অনুবাদ/তাফসির), alquran.cloud (ঐচ্ছিক ইংরেজি ট্রান্সলিটারেশন),
   অডিও: everyayah.com। বিস্তারিত "সূত্র ও সীমাবদ্ধতা" পাতায়।
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const p3=n=>String(n).padStart(3,'0');


/* =========================================================
   v2 কোর: সময়, নরমালাইজেশন, স্টোরেজ (localStorage + IndexedDB)
   ========================================================= */
const todayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayNum=(d=new Date())=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const fnv=s=>{let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')};
const bd2en=s=>String(s).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtBytes=b=>b>=1048576?B((b/1048576).toFixed(1))+' MB':B(Math.max(1,Math.round(b/1024)))+' KB';
const AR_MARKS=/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
/* বাংলা/আরবি-নিরপেক্ষ নরমালাইজেশন: হরকত বাদ, আলিফ/ইয়া একীকরণ, বাংলা-আরবি সংখ্যা → ASCII */
function nz(s){s=String(s==null?'':s).normalize('NFKC');
  s=s.replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  s=s.replace(AR_MARKS,'').replace(/[\u0622\u0623\u0625\u0671-\u0673]/g,'\u0627').replace(/[\u0649\u0626\u06CC]/g,'\u064A').replace(/\u0629/g,'\u0647').replace(/\u0624/g,'\u0648').replace(/\u06A9/g,'\u0643');
  s=s.replace(/[\u200b-\u200f]/g,'').toLowerCase();
  return s.replace(/[^a-z0-9\u0621-\u064A\u0980-\u09ff\s]/g,' ').replace(/\s+/g,' ').trim()}
const AR_RUN=/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]+(?:[\s\u200c\u200d]+[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]+)*/g;
const wrapAr=h=>h.replace(AR_RUN,m=>`<span lang="ar" dir="rtl" class="arinline">${m}</span>`);

const isQuota=e=>!!e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014||/quota/i.test(String(e.message||'')));
function quotaAlert(where){const b=document.getElementById('storeBanner');if(!b)return;b.hidden=false;
  b.innerHTML='⚠️ <b>স্টোরেজ ভর্তি</b> ('+esc(where)+')। নতুন ডেটা সেভ হয়নি। <a href="#/downloads">ডাউনলোড ম্যানেজারে</a> গিয়ে অপ্রয়োজনীয় সূরা/অডিও মুছুন, অথবা ব্রাউজারের সাইট-ডেটা পরিষ্কার করুন। <button class="btn sm" id="sbClose" type="button">বন্ধ</button>';
  document.getElementById('sbClose').onclick=()=>{b.hidden=true}}

/* ছোট ব্যবহারকারী-ডেটা: localStorage (আগের কী-নাম অপরিবর্তিত, তাই বুকমার্ক/নোট/অগ্রগতি টিকে থাকে) */
const Store=(()=>{let ok=false;const mem={};
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');ok=true}catch(e){}
  return{ok,
    get(k,d){try{const v=ok?localStorage.getItem('hqn_'+k):mem[k];return v==null?d:JSON.parse(v)}catch(e){return d}},
    set(k,v){try{const s=JSON.stringify(v);if(ok)localStorage.setItem('hqn_'+k,s);else mem[k]=s;return true}catch(e){if(isQuota(e))quotaAlert('localStorage');return false}},
    del(k){try{if(ok)localStorage.removeItem('hqn_'+k);else delete mem[k]}catch(e){}},
    keys(pre){if(!ok)return Object.keys(mem).filter(k=>k.startsWith(pre));const r=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('hqn_'+pre))r.push(k.slice(4))}}catch(e){}return r},
    clear(){try{if(ok){Object.keys(localStorage).filter(k=>k.startsWith('hqn_')).forEach(k=>localStorage.removeItem(k))}else for(const k in mem)delete mem[k]}catch(e){}}
  }})();

/* বড় ডেটা (সূরা টেক্সট, অনুবাদ, অডিও): IndexedDB; না থাকলে শুধু মেমোরি */
const DB=(()=>{let dbp=null,memOnly=false;const M={kv:new Map(),audio:new Map()};
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{try{if(!window.indexedDB)throw new Error('IndexedDB নেই');
    const rq=indexedDB.open('hqn',1);
    rq.onupgradeneeded=()=>{const d=rq.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('audio'))d.createObjectStore('audio')};
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);rq.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}}).catch(()=>{memOnly=true;return null}));
  const run=async(st,mode,fn,mf)=>{const d=await open();if(!d)return mf(M[st]);
    return new Promise((res,rej)=>{try{const t=d.transaction(st,mode);const r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&'result' in r?r.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))}catch(e){rej(e)}})};
  const wq=p=>p.catch(e=>{if(isQuota(e))quotaAlert('IndexedDB');throw e});
  const bound=(lo,hi)=>IDBKeyRange.bound(lo,hi);
  return{persistent:()=>!memOnly,ready:()=>open().then(d=>!!d),
    get:(st,k)=>run(st,'readonly',s=>s.get(k),m=>m.get(k)),
    put:(st,k,v)=>wq(run(st,'readwrite',s=>s.put(v,k),m=>{m.set(k,v)})),
    del:(st,k)=>run(st,'readwrite',s=>s.delete(k),m=>{m.delete(k)}),
    keys:st=>run(st,'readonly',s=>s.getAllKeys(),m=>[...m.keys()]),
    range:async(st,lo,hi)=>{const d=await open();if(!d)return [...M[st].entries()].filter(([k])=>k>=lo&&k<=hi).map(([k,v])=>({k,v}));
      return new Promise((res,rej)=>{const out=[];const t=d.transaction(st,'readonly');const rq=t.objectStore(st).openCursor(bound(lo,hi));
        rq.onsuccess=()=>{const c=rq.result;if(c){out.push({k:c.key,v:c.value});c.continue()}};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
    delRange:async(st,lo,hi)=>{const d=await open();if(!d){[...M[st].keys()].filter(k=>k>=lo&&k<=hi).forEach(k=>M[st].delete(k));return}
      return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).delete(bound(lo,hi));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
    clearAll:async()=>{const d=await open();if(!d){M.kv.clear();M.audio.clear();return}
      return new Promise((res,rej)=>{const t=d.transaction(['kv','audio'],'readwrite');t.objectStore('kv').clear();t.objectStore('audio').clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}}})();
async function storageEstimate(){try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();return{use:e.usage||0,quota:e.quota||0}}}catch(e){}return null}

const P=Object.assign({theme:matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',ar:34,bn:17,arLh:2.25,bnLh:1.8,motion:'auto',font:true,qari:'Alafasy_128kbps',tr:null,tf:null,en:false,tj:false,reviewer:'',madhhab:'hanafi',h12:true},Store.get('prefs',{}));
const savePrefs=()=>Store.set('prefs',P);
function applyPrefs(){const r=document.documentElement;r.dataset.theme=P.theme;r.dataset.motion=P.motion||'auto';
  r.style.setProperty('--ar-size',P.ar+'px');r.style.setProperty('--bn-size',P.bn+'px');r.style.setProperty('--ar-lh',P.arLh);r.style.setProperty('--bn-lh',P.bnLh);
  let l=document.getElementById('gfont');
  if(P.font&&!l&&navigator.onLine!==false){l=document.createElement('link');l.id='gfont';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Sans+Bengali:wght@400;500;700&display=swap';document.head.appendChild(l)}
  else if(!P.font&&l)l.remove()}

/* আগের সংস্করণের localStorage ক্যাশ (সূরা টেক্সট/অনুবাদ) → IndexedDB; ব্যবহারকারীর ডেটা অপরিবর্তিত */
async function migrateLS(){if(!Store.ok)return;/* idempotent: leftover old-format caches are always moved, flag not needed */
  try{for(const k of Store.keys('')){let m,put=null;
    if(m=k.match(/^ar_(\d+)$/)){const ar=Store.get(k,null);if(Array.isArray(ar))put=['ar:'+m[1],{ar,src:'Quran.com API v4 (আগের সংস্করণের ক্যাশ)',t:0,csum:fnv(ar.join('\n'))}]}
    else if(m=k.match(/^tr_(\d+)_(\d+)$/)){const tr=Store.get(k,null);if(Array.isArray(tr))put=[`tr:${m[1]}:${m[2]}`,{tr,id:+m[1],t:0}]}
    else if(m=k.match(/^en_(\d+)$/)){const en=Store.get(k,null);if(Array.isArray(en))put=['en:'+m[1],en]}
    else if(k==='trlist'||k==='tflist'){const l=Store.get(k,null);if(Array.isArray(l))put=[k,l]}
    else continue;
    if(put){await DB.put('kv',put[0],put[1]);Store.del(k)}}
    Store.set('migrated2',true)}catch(e){}}

/* ---------- ১১৪ সূরার মেটাডেটা: [আরবি, বাংলা, ট্রান্সলিটারেশন, আয়াত, M/D] ---------- */
const SR=[
['الفاتحة','আল-ফাতিহা','Al-Fatihah',7,'M'],['البقرة','আল-বাকারা','Al-Baqarah',286,'D'],['آل عمران','আলে ইমরান',"Ali 'Imran",200,'D'],['النساء','আন-নিসা','An-Nisa',176,'D'],['المائدة','আল-মায়িদা',"Al-Ma'idah",120,'D'],
['الأنعام','আল-আনআম',"Al-An'am",165,'M'],['الأعراف','আল-আ‘রাফ',"Al-A'raf",206,'M'],['الأنفال','আল-আনফাল','Al-Anfal',75,'D'],['التوبة','আত-তাওবা','At-Tawbah',129,'D'],['يونس','ইউনুস','Yunus',109,'M'],
['هود','হূদ','Hud',123,'M'],['يوسف','ইউসুফ','Yusuf',111,'M'],['الرعد','আর-রা‘দ',"Ar-Ra'd",43,'D'],['إبراهيم','ইবরাহিম','Ibrahim',52,'M'],['الحجر','আল-হিজর','Al-Hijr',99,'M'],
['النحل','আন-নাহল','An-Nahl',128,'M'],['الإسراء','আল-ইসরা','Al-Isra',111,'M'],['الكهف','আল-কাহফ','Al-Kahf',110,'M'],['مريم','মারইয়াম','Maryam',98,'M'],['طه','ত্বোয়া-হা','Taha',135,'M'],
['الأنبياء','আল-আম্বিয়া','Al-Anbiya',112,'M'],['الحج','আল-হজ','Al-Hajj',78,'D'],['المؤمنون','আল-মু’মিনূন',"Al-Mu'minun",118,'M'],['النور','আন-নূর','An-Nur',64,'D'],['الفرقان','আল-ফুরকান','Al-Furqan',77,'M'],
['الشعراء','আশ-শু‘আরা',"Ash-Shu'ara",227,'M'],['النمل','আন-নামল','An-Naml',93,'M'],['القصص','আল-কাসাস','Al-Qasas',88,'M'],['العنكبوت','আল-আনকাবূত',"Al-'Ankabut",69,'M'],['الروم','আর-রূম','Ar-Rum',60,'M'],
['لقمان','লুকমান','Luqman',34,'M'],['السجدة','আস-সাজদাহ','As-Sajdah',30,'M'],['الأحزاب','আল-আহযাব','Al-Ahzab',73,'D'],['سبأ','সাবা','Saba',54,'M'],['فاطر','ফাতির','Fatir',45,'M'],
['يس','ইয়াসীন','Ya-Sin',83,'M'],['الصافات','আস-সাফফাত','As-Saffat',182,'M'],['ص','সোয়াদ','Sad',88,'M'],['الزمر','আয-যুমার','Az-Zumar',75,'M'],['غافر','গাফির','Ghafir',85,'M'],
['فصلت','ফুসসিলাত','Fussilat',54,'M'],['الشورى','আশ-শূরা','Ash-Shura',53,'M'],['الزخرف','আয-যুখরুফ','Az-Zukhruf',89,'M'],['الدخان','আদ-দুখান','Ad-Dukhan',59,'M'],['الجاثية','আল-জাসিয়া','Al-Jathiyah',37,'M'],

const QAPI='https://api.quran.com/api/v4',QALT='https://api.alquran.cloud/v1';
const MEM={};
function errMsg(e){if(!e)return 'অজানা ত্রুটি';if(e.offline)return 'ইন্টারনেট সংযোগ নেই';if(e.name==='AbortError')return 'সময় শেষ (সার্ভার সাড়া দেয়নি)';
  if(e.status===429)return 'সার্ভার ব্যস্ত (অনুরোধ সীমা)';if(e.status>=500)return 'সার্ভার সমস্যা (HTTP '+e.status+')';if(e.status)return 'অনুরোধ ব্যর্থ (HTTP '+e.status+')';
  if(e.name==='TypeError')return 'নেটওয়ার্ক বা ব্রাউজার-নিরাপত্তা (CORS) ত্রুটি';return e.message||'অজানা ত্রুটি'}
async function fetchRetry(url,o={}){const tries=o.tries||4,to=o.timeout||12000;let last;
  for(let i=0;i<tries;i++){
    if(i>0)await sleep(Math.min(8000,500*2**(i-1))+Math.random()*250);
    if(navigator.onLine===false){const x=new Error('offline');x.offline=true;throw x}
    const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),to);
    try{const r=await fetch(url,Object.assign({signal:ctl.signal},o.init||{}));clearTimeout(tm);
      if(r.ok)return r;const e=new Error('HTTP '+r.status);e.status=r.status;last=e;
      if(r.status<500&&r.status!==429&&r.status!==408)throw e}
    catch(e){clearTimeout(tm);last=e;if(e.status&&e.status<500&&e.status!==429&&e.status!==408)throw e}}
  throw last||new Error('নেটওয়ার্ক ত্রুটি')}
async function jget(url,o){const r=await fetchRetry(url,o);try{return await r.json()}catch(e){throw new Error('সার্ভারের উত্তর পড়া যায়নি')}}
function clean(h){try{const d=new DOMParser().parseFromString('<div>'+h+'</div>','text/html');d.querySelectorAll('sup,script,style').forEach(e=>e.remove());return d.body.textContent.trim()}catch(e){return String(h).replace(/<[^>]+>/g,'')}}
function safeHTML(h){try{const ok=new Set(['P','BR','B','STRONG','I','EM','UL','OL','LI','H1','H2','H3','H4','SPAN','DIV','BLOCKQUOTE','U']);
  const d=new DOMParser().parseFromString('<div>'+h+'</div>','text/html');
  const walk=n=>{[...n.children].forEach(c=>{if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META'].includes(c.tagName)){c.remove();return}
    walk(c);if(!ok.has(c.tagName)){c.replaceWith(...c.childNodes)}else{[...c.attributes].forEach(a=>c.removeAttribute(a.name))}})};
  walk(d.body);return d.body.innerHTML}catch(e){return esc(clean(h))}}
async function cachedList(key,url,fk){let l=MEM[key]||await DB.get('kv',key).catch(()=>null);if(l&&l.length){MEM[key]=l;return l}
  const j=await jget(url);l=(j[fk]||[]).filter(t=>/bengali|bangla/i.test(t.language_name||'')).map(t=>({id:t.id,name:t.name,author:t.author_name}));
  if(l.length){MEM[key]=l;DB.put('kv',key,l).catch(()=>{})}return l}
const bnTranslations=()=>cachedList('trlist',QAPI+'/resources/translations','translations');
const bnTafsirs=()=>cachedList('tflist',QAPI+'/resources/tafsirs','tafsirs');

  let t=l.find(x=>x.id===P.tr);if(!t){t=l.find(x=>/muhiuddin/i.test(x.author+x.name))||l[0];P.tr=t.id;savePrefs()}return t}

/* আরবি টেক্সট যাচাই: আয়াত সংখ্যা, খালি/ল্যাটিন অক্ষর নেই */
function checkAr(n,ar){const s=SR[n-1];if(!Array.isArray(ar)||ar.length!==s.a)throw new Error('আয়াত সংখ্যা মেলেনি ('+(ar?ar.length:0)+' ≠ '+s.a+')');
  ar.forEach((t,i)=>{if(typeof t!=='string'||!/[\u0621-\u064A]/.test(t)||/[A-Za-z<>]/.test(t))throw new Error('আয়াত '+(i+1)+' এর টেক্সট অস্বাভাবিক')})}
async function altBsm(){if(MEM.altB)return MEM.altB;const j=await jget(`${QALT}/surah/1/quran-uthmani`);MEM.altB=j.data.ayahs[0].text;return MEM.altB}
async function altAr(n){const j=await jget(`${QALT}/surah/${n}/quran-uthmani`);const ar=(j.data.ayahs||[]).map(a=>a.text);let warn=null;
  if(n!==1&&n!==9&&ar.length){const b=await altBsm();if(b&&ar[0].startsWith(b))ar[0]=ar[0].slice(b.length).replace(/^[\s\u200b-\u200f]+/,'');else if(nz(ar[0]).startsWith(nz(b)))warn='প্রথম আয়াতের শুরুতে বিসমিল্লাহ থেকে যেতে পারে (ফলব্যাক সোর্সের বিন্যাস ভিন্ন)'}
  checkAr(n,ar);return{ar,src:'alquran.cloud — quran-uthmani (ফলব্যাক সোর্স)',t:Date.now(),alt:true,warn}}
async function getAr(n){const k='ar:'+n;let rec=MEM[k]||await DB.get('kv',k).catch(()=>null);
  if(rec&&Array.isArray(rec.ar)&&rec.ar.length===SR[n-1].a){MEM[k]=rec;return rec}
  const errs=[];
  try{const j=await jget(`${QAPI}/quran/verses/uthmani?chapter_number=${n}`);const ar=(j.verses||[]).map(v=>v.text_uthmani);checkAr(n,ar);rec={ar,src:'Quran.com API v4 — text_uthmani',t:Date.now()}}
  catch(e){errs.push('Quran.com: '+errMsg(e));
    try{rec=await altAr(n)}catch(e2){errs.push('alquran.cloud: '+errMsg(e2));const er=new Error(errs.join(' | '));er.list=errs;throw er}}
  rec.csum=fnv(rec.ar.join('\n'));MEM[k]=rec;DB.put('kv',k,rec).catch(()=>{});return rec}
async function metaFor(id){if(id==='alt')return{name:'বাংলা অনুবাদ (bn.bengali)',author:'alquran.cloud — ফলব্যাক সোর্স'};
  try{const l=await bnTranslations();const m=l.find(x=>x.id===id);if(m)return m}catch(e){}return{name:'বাংলা অনুবাদ (ক্যাশ থেকে)',author:''}}
async function getTr(n){const need=SR[n-1].a;let rec=null;
  if(P.tr)rec=MEM[`tr:${P.tr}:${n}`]||await DB.get('kv',`tr:${P.tr}:${n}`).catch(()=>null);
  if(!rec){const any=(await DB.range('kv','tr:','tr:\uffff').catch(()=>[])).filter(x=>x.k.endsWith(':'+n)&&x.v&&x.v.tr&&x.v.tr.length===need);
    if(navigator.onLine===false&&any.length)rec=any[0].v}
  if(rec&&rec.tr&&rec.tr.length===need){MEM[`tr:${rec.id}:${n}`]=rec;return{tr:rec.tr,meta:await metaFor(rec.id)}}
  let perr=null;
  try{const t=await pickTr();if(t){const j=await jget(`${QAPI}/quran/translations/${t.id}?chapter_number=${n}`);const tr=(j.translations||[]).map(x=>clean(x.text));
      if(tr.length!==need)throw new Error('অনুবাদের আয়াত সংখ্যা মেলেনি ('+tr.length+' ≠ '+need+')');
      const r={tr,id:t.id,t:Date.now()};MEM[`tr:${t.id}:${n}`]=r;DB.put('kv',`tr:${t.id}:${n}`,r).catch(()=>{});return{tr,meta:t}}}
  catch(e){perr=e}
  try{const j=await jget(`${QALT}/surah/${n}/bn.bengali`);const tr=(j.data.ayahs||[]).map(a=>a.text);if(tr.length!==need)throw new Error('ফলব্যাক অনুবাদের সংখ্যা মেলেনি');
    const r={tr,id:'alt',t:Date.now()};DB.put('kv',`tr:alt:${n}`,r).catch(()=>{});return{tr,meta:await metaFor('alt')}}
  catch(e2){throw new Error((perr?errMsg(perr):'তালিকা নেই')+' (ফলব্যাকও ব্যর্থ: '+errMsg(e2)+')')}}
async function loadChapter(n){const out={ar:null,tr:null,trMeta:null,err:[],src:null,csum:null,warn:null};
  const [a,t]=await Promise.allSettled([getAr(n),getTr(n)]);
  if(a.status==='fulfilled'){out.ar=a.value.ar;out.src=a.value.src;out.csum=a.value.csum;out.warn=a.value.warn||null}else out.err.push('আরবি টেক্সট: '+(a.reason&&a.reason.list?a.reason.list.join(' | '):errMsg(a.reason)));
  if(t.status==='fulfilled'){out.tr=t.value.tr;out.trMeta=t.value.meta}else out.err.push('বাংলা অনুবাদ: '+(t.reason&&t.reason.message||errMsg(t.reason)));
  return out}

function tjClean(h){const d=new DOMParser().parseFromString('<div>'+h+'</div>','text/html');const out=[];
  const walk=nd=>nd.childNodes.forEach(c=>{if(c.nodeType===3)out.push(esc(c.textContent));
    else if(c.nodeType===1){const cl=(c.getAttribute('class')||'').replace(/[^a-z_ ]/g,'').trim();if(cl==='end'||c.tagName==='SUP')return;
      if(c.tagName==='TAJWEED'||c.tagName==='SPAN'){const m=TJ[cl];out.push(`<span class="tj tj-${m?m[0]:'x'}" data-r="${cl||''}">`);walk(c);out.push('</span>')}else walk(c)}});
  walk(d.body);return out.join('')}
const stripHtml=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};
async function loadTajweed(n,plain){const k='tj:'+n;let rec=MEM[k]||await DB.get('kv',k).catch(()=>null);

const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const BK_VALID={prefs:isObj,bm:x=>Array.isArray(x)&&x.every(s=>/^\d{1,3}:\d{1,3}$/.test(s)),notes:x=>isObj(x)&&Object.values(x).every(v=>typeof v==='string'),last:x=>x===null||isObj(x),

async function restoreBackup(file,mode){let o;try{o=JSON.parse(await file.text())}catch(e){throw new Error('ফাইলটি বৈধ JSON নয়')}
  if(!isObj(o)||o.app!=='hqn'||!isObj(o.data))throw new Error('এটি এই অ্যাপের ব্যাকআপ ফাইল নয়');
  const ok=[],skip=[];for(const k of Object.keys(o.data)){if(USERKEYS.includes(k)&&BK_VALID[k]&&BK_VALID[k](o.data[k]))ok.push(k);else skip.push(k)}
  if(!ok.length)throw new Error('ফাইলে ব্যবহারযোগ্য ডেটা নেই');
  for(const k of ok){const v=o.data[k],cur=Store.get(k,undefined);let nv=v;
    if(mode==='merge'&&cur!==undefined){if(Array.isArray(v)&&Array.isArray(cur))nv=k==='reports'?[...v,...cur.filter(c=>!v.some(x=>x.id===c.id))]:[...new Set([...cur,...v].map(x=>typeof x==='object'?JSON.stringify(x):x))].map(x=>{try{return typeof x==='string'&&x[0]==='{'?JSON.parse(x):x}catch(e){return x}});
      else if(isObj(v)&&isObj(cur))nv=Object.assign({},cur,v)}
    if(!Store.set(k,nv))throw new Error('সেভ করা যায়নি (স্টোরেজ সমস্যা)')}
  return{ok,skip}}

const NEEDS='সূত্র যাচাই প্রয়োজন';
function refInfo(txt){const t=String(txt||'');
  const quran=/[০-৯0-9]+\s*[:：]\s*[০-৯0-9]+/.test(t);
  const colls=['বুখারি','মুসলিম','আবু দাউদ','তিরমিযি','নাসায়ি','ইবনে মাজাহ','আহমাদ'].filter(c=>t.includes(c));
  const hadith=colls.length>0||/হাদিস/.test(t);
  const sahih=t.includes('সহিহ')&&colls.some(c=>c==='বুখারি'||c==='মুসলিম')&&!colls.some(c=>!['বুখারি','মুসলিম'].includes(c));
  let grade=NEEDS,known=false;
  if(sahih){grade='সহিহ বুখারি/মুসলিমে সংকলিত (সংকলন-স্তরের তথ্য; নির্দিষ্ট বর্ণনা যাচাই প্রয়োজন)';known=true}
  else if(/সনদ নিয়ে|আলোচনা আছে/.test(t)){grade='সনদ নিয়ে আলোচনা আছে — '+NEEDS}
  else if(t.includes('হাসান')){grade='হাসান (সূত্রে উল্লেখিত)';known=true}
  else if(!hadith&&quran){grade='কুরআনের আয়াত (আরবি টেক্সট API থেকে মেলানো যায়)';known=true}
  else if(!hadith){grade='ফিকহি/আসার ভিত্তিক — হাদিসের মান প্রযোজ্য নয় বা '+NEEDS}
  return{quran,hadith,grade,known}}

/* ডায়ালগ: <dialog> থাকলে মোডাল, নইলে prompt() */
function askDialog(title,fields,okLabel){return new Promise(res=>{const d=document.getElementById('dlg');
  if(!d||typeof d.showModal!=='function'){const o={};for(const f of fields){const v=prompt(f.label,f.value||'');if(v===null){res(null);return}o[f.name]=v}res(o);return}
  const fh=fields.map(f=>{const id='df_'+f.name;const lab=`<label for="${id}">${esc(f.label)}</label>`;
    if(f.type==='textarea')return lab+`<textarea id="${id}" name="${f.name}" rows="5" ${f.req?'required':''}>${esc(f.value||'')}</textarea>`;
    if(f.type==='select')return lab+`<select id="${id}" name="${f.name}">${f.options.map(o=>`<option ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    return lab+`<input id="${id}" name="${f.name}" type="${f.type||'text'}" value="${esc(f.value||'')}" ${f.req?'required':''}>`}).join('');
  d.innerHTML=`<form method="dialog"><h2 id="dlgTitle" class="pg" style="margin-top:0">${esc(title)}</h2>${fh}<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn alt" value="cancel" formnovalidate>বাতিল</button><button class="btn" value="ok">${esc(okLabel||'সংরক্ষণ')}</button></div></form>`;
  const done=()=>{d.removeEventListener('close',done);const f=d.querySelector('form');if(d.returnValue!=='ok'){res(null);return}const o={};fields.forEach(x=>{const el=f.elements[x.name];o[x.name]=el?el.value:''});res(o)};
  d.addEventListener('close',done);d.returnValue='';d.showModal();const first=d.querySelector('input,textarea,select');if(first)first.focus()})}

`## সময়ের সারসংক্ষেপ`,`- ফজর: সুবহে সাদিক থেকে সূর্যোদয় পর্যন্ত।`,`- যোহর: সূর্য মধ্য আকাশ পেরোনোর পর থেকে আসরের আগ পর্যন্ত।`,`- আসর: যোহরের সময় শেষ হওয়ার পর থেকে সূর্যাস্ত পর্যন্ত। আসরের শুরু নিয়ে মতভেদ আছে (হানাফি: ছায়া দ্বিগুণ হলে; অন্যান্য: ছায়া সমান হলে)।`,`- মাগরিব: সূর্যাস্তের পর থেকে পশ্চিম আকাশের আভা থাকা পর্যন্ত (আভার সংজ্ঞায় মতভেদ আছে)।`,`- এশা: মাগরিবের সময় শেষ হওয়ার পর থেকে সুবহে সাদিক পর্যন্ত।`,

{t:'কিয়াম ও হাত বাঁধা',b:[
`ফরজ নামাজে সক্ষম হলে দাঁড়িয়ে পড়া ফরজ (কিয়াম)।`,
`- দৃষ্টি সিজদার স্থানে রাখা, দুই পায়ের মাঝে স্বাভাবিক ফাঁক রাখা।`,`- হাত বাঁধা: হানাফি মতে পুরুষ নাভির নিচে ডান হাত বাম হাতের ওপর রাখে; নারী বুকের ওপর। শাফেয়ি ও হাম্বলি মতে সাধারণত বুকের ওপর/নিচে; মালেকি মতে কিছু বর্ণনায় হাত ছেড়ে রাখার প্রচলন। এ বিষয়ে মতভেদ আছে।`,`- অসুস্থ হলে বসে বা শুয়ে পড়ার বিধান আছে (পাঠ ৩৭ দেখুন)।`],r:'সহিহ বুখারি (ডান হাত বাম হাতের ওপর রাখার বর্ণনা, সাহল ইবনে সা‘দ রা.); মতভেদ ফিকহের গ্রন্থে'},
{t:'সানা',b:[
`প্রথম রাকাতে হাত বাঁধার পর (হানাফি মতে) সানা পড়া হয়। এটি সুন্নত।`,
`মূল পাঠ ও অর্থ “নামাজের দোয়া ও সূরা” অংশে আছে।`,`অন্য মাজহাবে ভিন্ন সানা/ইস্তিফতাহ দোয়াও প্রচলিত (যেমন, শাফেয়ি মতে “ওয়াজ্জাহতু ওয়াজহিয়া…”, বা “আল্লাহুম্মা বা‘য়িদ বাইনী…”)—এগুলোও হাদিসে বর্ণিত।`,`মুক্তাদি (মুসল্লি) ইমামের পেছনে সানা পড়ে নেন; হানাফি মতে ইমাম কিরাত শুরু করার আগে।`],r:'সূত্র: হাদিসের গ্রন্থসমূহে একাধিক দোয়া বর্ণিত; নির্দিষ্ট নম্বর এখানে যাচাই করে যোগ করা হয়নি'},
{t:'আউযুবিল্লাহ ও বিসমিল্লাহ',b:[
`কিরাতের আগে আশ্রয় প্রার্থনা: “আউযুবিল্লাহি মিনাশ শাইত্বানির রজীম” (সূরা নাহল ১৬:৯৮-এর নির্দেশের আলোকে)।`,
`- হানাফি মতে আউযুবিল্লাহ শুধু প্রথম রাকাতে এবং প্রতি রাকাতে ফাতিহার আগে বিসমিল্লাহ চুপে পড়া হয়।`,`- শাফেয়ি মতে বিসমিল্লাহ ফাতিহার অংশ হিসেবে পড়া হয়; মালেকি মতে ফরজ নামাজে বিসমিল্লাহ পড়া হয় না। এখানে মতভেদ আছে।`],r:'সূরা নাহল ১৬:৯৮; মতভেদ ফিকহের গ্রন্থে'},
{t:'সূরা আল-ফাতিহা',b:[
`হাদিসে এসেছে, যে ফাতিহা পড়ে না তার নামাজ নেই (সহিহ বুখারি ও মুসলিম, উবাদা ইবনে সামিত রা.)।`,
`- হানাফি মতে ফাতিহা পড়া ওয়াজিব; শাফেয়ি, মালেকি ও হাম্বলি মতে রুকন (ফরজ)।`,`- জামাতে মুক্তাদির ফাতিহা পড়া নিয়ে মতভেদ আছে: হানাফি মতে মুক্তাদি পড়বে না (ইমামের কিরাতই যথেষ্ট), শাফেয়ি মতে পড়বে, হাম্বলি/মালেকি মতে জেহরি নামাজে পড়বে না, সিররি নামাজে পড়বে।`,`- “আমীন”: হানাফি মতে চুপে, শাফেয়ি/হাম্বলি মতে জেহরি নামাজে জোরে।`,
`সূরাটির আরবি পাঠ, অর্থ ও অডিও “নামাজের দোয়া ও সূরা” অংশে আছে। উচ্চারণ ও তাজবিদ কোনো যোগ্য ক্বারির কাছ থেকে শিখুন।`],r:'সহিহ বুখারি ও মুসলিম (উবাদা ইবনে সামিত); মতভেদ ফিকহের গ্রন্থে'},
{t:'অন্যান্য সূরা',b:[
`ফাতিহার পর কুরআনের অন্য অংশ পড়া হয়।`,
`- হানাফি মতে ফরজের প্রথম দুই রাকাতে, এবং সুন্নত/নফল/বিতরের সব রাকাতে ফাতিহার পর একটি সূরা বা অন্তত তিনটি ছোট আয়াত (বা একটি বড় আয়াত) মেলানো ওয়াজিব। ফরজের তৃতীয়/চতুর্থ রাকাতে শুধু ফাতিহা।`,`- অন্য মাজহাবেও প্রথম দুই রাকাতে সূরা মেলানো সুন্নত।`,`- শুরুতে ছোট সূরা দিয়ে অনুশীলন করা যায়: যেমন ইখলাস, ফালাক, নাস, কাউসার, আসর।`,`- ফজর, মাগরিব ও এশার প্রথম দুই রাকাতে ইমাম জোরে (জেহর), যোহর ও আসরে চুপে (সির) কিরাত পড়েন।`],r:'ফিকহের গ্রন্থসমূহ; মতভেদ চিহ্নিত'},
{t:'রুকু',b:[
`কিরাত শেষে “আল্লাহু আকবার” বলে রুকুতে যান।`,
`- দুই হাত হাঁটুতে রাখুন, আঙুল ফাঁক করে।`,`- পিঠ সোজা ও মাথা পিঠ বরাবর রাখুন।`,`- দৃষ্টি পায়ের পাতার দিকে।`,`- ধীরস্থিরভাবে (তুমানিনা সহ) অবস্থান করুন।`,
`রুকু সব মাজহাবে ফরজ/রুকন।`,`নারীদের জন্য হানাফি ফিকহে সামান্য কম নত হওয়ার কথা আছে (পাঠ ৩৬ দেখুন)।`],r:'সহিহ বুখারি ও মুসলিম (“ভুল নামাজি” সংক্রান্ত হাদিস, আবু হুরায়রা রা.—ধীরস্থিরতা)'},
{t:'রুকুর তাসবিহ',b:[
`রুকুতে পড়া হয়: “সুবহানা রাব্বিয়াল আযীম”।`,
`- হাদিসে হুযাইফা (রা.) বর্ণিত রাত্রির নামাজের বিবরণে (সহিহ মুসলিম) রুকুতে এই তাসবিহ পড়ার কথা আছে।`,`- তিনবার পড়াকে আলেমগণ মুস্তাহাব/সুন্নত বলেছেন; তিনবারের বর্ণনার সনদ নিয়ে মুহাদ্দিসদের আলোচনা আছে। পড়া সংখ্যা বেজোড় রাখা ও অন্তত তিনবার—ফিকহে প্রচলিত।`,`- রুকুতে কুরআন তিলাওয়াত নিষেধ (সহিহ মুসলিম, ইবনে আব্বাস রা.)।`],r:'সহিহ মুসলিম (হুযাইফা রা.; ইবনে আব্বাস রা.)'},
{t:'রুকু থেকে ওঠা',b:[
`রুকু থেকে সোজা হয়ে দাঁড়ানোর সময় ইমাম/একাকী বলেন: “সামিআল্লাহু লিমান হামিদাহ”।`,
`তারপর বলা হয়: “রাব্বানা লাকাল হামদ”।`,
`## মতভেদ`,`- হানাফি মতে: ইমাম শুধু “সামিআল্লাহু…”, মুক্তাদি শুধু “রাব্বানা লাকাল হামদ”, একাকী উভয়টি।`,`- শাফেয়ি ও হাম্বলি মতে: ইমাম ও একাকী উভয়টি বলেন; মুক্তাদি “রাব্বানা…”।`,
`- রুকু থেকে ওঠার পর সোজা হয়ে স্থির দাঁড়ানো গুরুত্বপূর্ণ—“ভুল নামাজি”র হাদিসে ধীরস্থিরতার তাগিদ আছে (সহিহ বুখারি ও মুসলিম)।`],r:'সহিহ বুখারি ও মুসলিম; মতভেদ ফিকহের গ্রন্থে'},
{t:'সিজদা',b:[
`“আল্লাহু আকবার” বলে সিজদায় যান।`,
`## সাত অঙ্গে সিজদা`,`হাদিসে সাত অঙ্গের ওপর সিজদার নির্দেশ এসেছে (সহিহ বুখারি ও মুসলিম, ইবনে আব্বাস রা.): কপাল (নাকসহ), দুই হাতের তালু, দুই হাঁটু ও দুই পায়ের আঙুল।`,
`- হাত কান বা কাঁধ বরাবর মাটিতে রাখুন; পুরুষ কনুই শরীর ও মাটি থেকে আলাদা রাখে এবং পেট উরু থেকে দূরে রাখে (হানাফি ফিকহে নারীদের জন্য জড়সড় হয়ে সিজদার কথা আছে)।`,`- তাসবিহ: “সুবহানা রাব্বিয়াল আ‘লা”।`,`- সিজদায় বান্দা রবের সবচেয়ে নিকটে থাকে, তাই বেশি দোয়া করা উচিত (সহিহ মুসলিম, আবু হুরায়রা রা.)।`,`- ফরজ নামাজে সিজদায় কুরআনের দোয়াই পড়া—এ নিয়ে ফিকহী মতভেদ আছে; হাদিসের দোয়া সবাই বৈধ বলেন।`],r:'সহিহ বুখারি ও মুসলিম (সাত অঙ্গ); সহিহ মুসলিম (সিজদায় দোয়া)'},
{t:'দুই সিজদার মাঝখানে বসা',b:[
`প্রথম সিজদা থেকে “আল্লাহু আকবার” বলে উঠে স্থির হয়ে বসুন (জালসা)।`,
`- বসার পদ্ধতি (হানাফি, শাফেয়ি ও হাম্বলি সাধারণ মত): বাম পা বিছিয়ে তার ওপর বসা ও ডান পা খাড়া রাখা।`,`- দুই হাত হাঁটুর ওপর/উরুতে রাখুন।`,`- দোয়া “রাব্বিগফিরলী”—হুযাইফা (রা.)-এর হাদিসে এর উল্লেখ আছে (আবু দাউদ, নাসায়ি, ইবনে মাজাহ)। শাফেয়ি ও হাম্বলি মতে দোয়াটি পড়া হয়; হানাফি ফিকহে এখানে নির্দিষ্ট দোয়া বাধ্যতামূলক নয় (অনেকে নফল নামাজে পড়াকে ভালো মনে করেন)।`,`- স্থির হয়ে বসা জরুরি।`],r:'সুনানে আবু দাউদ, নাসায়ি ও ইবনে মাজাহ (হুযাইফা রা.); মতভেদ ফিকহে'},
{t:'দ্বিতীয় সিজদা',b:[
`“আল্লাহু আকবার” বলে প্রথম সিজদার মতোই দ্বিতীয় সিজদা করুন এবং “সুবহানা রাব্বিয়াল আ‘লা” পড়ুন।`,
`এরপর:`,`- রাকাত বাকি থাকলে “আল্লাহু আকবার” বলে সোজা উঠে পরের রাকাতে যান (হানাফি মতে হাতে ভর না দিয়ে হাঁটুতে ভর দিয়ে ওঠা মুস্তাহাব; অন্য মতে ভিন্ন)।`,`- বৈঠকের রাকাত হলে বৈঠকে বসুন।`],r:'ফিকহের গ্রন্থসমূহ'},
{t:'বৈঠক',b:[
`দুই রাকাত পর (প্রথম বৈঠক) এবং শেষ রাকাতে (শেষ বৈঠক) বসতে হয়।`,
`- হানাফি মতে প্রথম বৈঠক ওয়াজিব, শেষ বৈঠক ফরজ (অন্তত তাশাহহুদ পরিমাণ সময়)।`,`- বসার ধরন: প্রথম বৈঠকে বাম পা বিছিয়ে বসা। শেষ বৈঠকে হানাফি ও মালেকি মতে বাম পা বিছিয়ে বসা (নারীদের জন্য হানাফি ফিকহে ভিন্ন, পাঠ ৩৬); শাফেয়ি ও হাম্বলি মতে শেষ বৈঠকে তাওয়াররুক (নিতম্বে ভর দিয়ে বসা)।`,`- শাহাদাত আঙুল ওঠানো: হানাফি মতে “লা ইলাহা” বলার সময় তুলে “ইল্লাল্লাহ” বলার সময় নামানো; অন্য মাজহাবে পুরো তাশাহহুদে বা “ইল্লাল্লাহ”-তে তোলার মত আছে।`],r:'সহিহ মুসলিম (আঙুল ওঠানো); ফিকহের গ্রন্থে মতভেদ'},
{t:'আত্তাহিয়্যাতু',b:[
`বৈঠকে প্রথমেই তাশাহহুদ (আত্তাহিয়্যাতু) পড়া হয়। ইবনে মাসউদ (রা.)-এর বর্ণনা সহিহ বুখারি ও মুসলিমে এসেছে।`,
`- হানাফি মতে তাশাহহুদ ওয়াজিব; শাফেয়ি ও হাম্বলি মতে শেষ বৈঠকে রুকন।`,`- আরবি পাঠ, বাংলা উচ্চারণ ও অর্থ “নামাজের দোয়া ও সূরা” অংশে আছে।`,`- তিন বা চার রাকাতের নামাজে প্রথম বৈঠকে (হানাফি মতে ফরজে) শুধু তাশাহহুদ পড়ে উঠে যাওয়া হয়।`],r:'সহিহ বুখারি ও মুসলিম (ইবনে মাসউদ রা.)'},
{t:'দরুদে ইবরাহিম',b:[
`শেষ বৈঠকে তাশাহহুদের পর দরুদ পড়া হয়। কা‘ব ইবনে উজরা (রা.)-এর হাদিস সহিহ বুখারি ও মুসলিমে আছে।`,
`- হানাফি ও মালেকি মতে শেষ বৈঠকে দরুদ পড়া সুন্নত; শাফেয়ি ও হাম্বলি মতে শেষ বৈঠকে ওয়াজিব/রুকন (হাম্বলি মতে বিস্তারিত ভিন্নতা আছে)।`,`- পাঠ “নামাজের দোয়া ও সূরা” অংশে।`],r:'সহিহ বুখারি ও মুসলিম (কা‘ব ইবনে উজরা রা.); মতভেদ ফিকহে'},
{t:'মাসুরা দোয়া',b:[
`দরুদের পর সালামের আগে কুরআন-হাদিসে বর্ণিত যেকোনো দোয়া পড়া যায়।`,
`- প্রসিদ্ধ দোয়া: আবু বকর (রা.)-কে নবী (সা.) যে দোয়া শিখিয়েছিলেন “আল্লাহুম্মা ইন্নী যালামতু নাফসী…” (সহিহ বুখারি ও মুসলিম)।`,`- কুরআনের দোয়া যেমন “রাব্বানা আতিনা ফিদ্দুনইয়া হাসানাহ…” (সূরা বাকারা ২:২০১), “রাব্বিজ‘আলনী মুকীমাস সালাতি…” (সূরা ইবরাহিম ১৪:৪০-৪১)ও পড়া হয়।`,`- হানাফি ফিকহে নামাজের দোয়া কুরআন-হাদিসে বর্ণিত শব্দে হওয়া বাঞ্ছনীয়; সাধারণ মানুষের কথার ধাঁচে নয়।`],r:'সহিহ বুখারি ও মুসলিম (আবু বকর রা.); সূরা বাকারা ২:২০১; ইবরাহিম ১৪:৪০-৪১'},
{t:'সালাম ফেরানো',b:[
`শেষ বৈঠকের পর প্রথমে ডানে, পরে বামে মুখ ফিরিয়ে বলা হয়: “আস্সালামু আলাইকুম ওয়া রাহমাতুল্লাহ”।`,
`- সালামে ফেরেশতা ও পাশের মুসল্লিদের উদ্দেশ্য করা যায়।`,`- হানাফি মতে সালাম ফেরানো ওয়াজিব। শাফেয়ি মতে প্রথম সালাম রুকন, দ্বিতীয়টি সুন্নত; হাম্বলি মতে দুই সালামের বিষয়ে বিভিন্ন মত আছে।`,`- সালামের পর মাসনুন যিকির আছে (দোয়া ও যিকির অংশ দেখুন)।`],r:'সুনানে আবু দাউদ ও তিরমিযি (দুই সালামের বর্ণনা); মতভেদ ফিকহে'},
{t:'বিতর ও দোয়া কুনুত',b:[
`## হানাফি মতে`,`- বিতর তিন রাকাত ওয়াজিব; এশার ফরজের পর ও সুবহে সাদিকের আগে পড়তে হয়।`,`- এক সালামে তিন রাকাত; দ্বিতীয় রাকাতের পর বসে শুধু তাশাহহুদ পড়ে উঠে যাওয়া হয়।`,`- তৃতীয় রাকাতে ফাতিহা ও সূরার পর “আল্লাহু আকবার” বলে কান পর্যন্ত হাত তুলে আবার হাত বেঁধে দোয়া কুনুত পড়া হয়, তারপর রুকু।`,`- দোয়া কুনুত মুখস্থ না থাকলে কিছু হানাফি আলেম “রাব্বানা আতিনা ফিদ্দুনইয়া…” বা “আল্লাহুম্মাগফিরলী” তিনবার বলার অনুমতি দেন; স্থানীয় আলেমের কাছে নিশ্চিত হোন।`,
`## অন্য মাজহাব`,`শাফেয়ি, মালেকি ও হাম্বলি মতে বিতর সুন্নতে মুয়াক্কাদা; এক, তিন, পাঁচ—বিভিন্ন সংখ্যায় পড়া বৈধ; কুনুতের সময় ও স্থান নিয়েও ভিন্নতা আছে।`,`দোয়া কুনুতের পাঠ “নামাজের দোয়া ও সূরা” অংশে আছে (এটি সাহাবিদের থেকে বর্ণিত—আসার)।`],r:'ফিকহের গ্রন্থসমূহ; মতভেদ চিহ্নিত'},
{t:'পাঁচ ওয়াক্ত নামাজ',b:[
`দিন-রাতে পাঁচ ওয়াক্ত ফরজ নামাজ: ফজর, যোহর, আসর, মাগরিব, এশা।`,
`## ফরজ রাকাত সংখ্যা`,`- ফজর: ২`,`- যোহর: ৪`,`- আসর: ৪`,`- মাগরিব: ৩`,`- এশা: ৪`,
`সফরে চার রাকাতের ফরজ কসর হয়ে ২ রাকাত হয় (পাঠ ৩৭)।`,`বিস্তারিত রাকাত-তালিকা “নামাজ শিক্ষা → ধাপে ধাপে টিউটোরিয়াল” পাতায় দেখুন।`],r:'সূরা নিসা ৪:১০৩; সহিহ বুখারি ও মুসলিম (পাঁচ ওয়াক্ত সংক্রান্ত বর্ণনা)'},
{t:'ফরজ, সুন্নত ও নফল নামাজ',b:[
`- ফরজ: অবশ্যই পালনীয়; ছাড়লে গুনাহ।`,`- ওয়াজিব (হানাফি পরিভাষা): ফরজের কাছাকাছি—যেমন বিতর, ঈদের নামাজ।`,`- সুন্নতে মুয়াক্কাদা: নবী (সা.) নিয়মিত পড়তেন।`,`- সুন্নতে গাইরে মুয়াক্কাদা ও নফল: ঐচ্ছিক, সওয়াবের কাজ।`,
`## বারো রাকাত সুন্নত`,`উম্মে হাবীবা (রা.) থেকে সহিহ মুসলিমে বর্ণিত—যে ব্যক্তি দিনরাতে বারো রাকাত (নিয়মিত সুন্নত) পড়ে, তার জন্য জান্নাতে ঘর নির্মিত হয়। হানাফি তালিকা: ফজরের আগে ২, যোহরের আগে ৪ ও পরে ২, মাগরিবের পরে ২, এশার পরে ২। শাফেয়ি ইত্যাদি মাজহাবে সংখ্যা ও বিন্যাস কিছুটা ভিন্ন।`,
`ফজরের দুই রাকাত সুন্নত সম্পর্কে হাদিসে এসেছে তা দুনিয়া ও তার সবকিছু থেকে উত্তম (সহিহ মুসলিম, আয়েশা রা.)।`,`তাহাজ্জুদ, চাশত, তাহিয়্যাতুল মসজিদ ইত্যাদি নফল নামাজও আছে (তাহাজ্জুদ—সূরা বনি ইসরাঈল ১৭:৭৯)।`],r:'সহিহ মুসলিম (উম্মে হাবীবা; আয়েশা রা.); সূরা ১৭:৭৯'},
{t:'জামাতে নামাজ',b:[
`- হাদিসে জামাতের নামাজকে একাকী নামাজের চেয়ে ২৭ গুণ মর্যাদাপূর্ণ বলা হয়েছে (সহিহ বুখারি ও মুসলিম, ইবনে উমর রা.)।`,`- হুকুম: হানাফি মতে সুন্নতে মুয়াক্কাদা (ওয়াজিবের কাছাকাছি); হাম্বলি মতে পুরুষদের ওপর ওয়াজিব; শাফেয়ি মতে ফরজে কিফায়া/সুন্নতে মুয়াক্কাদা—মতভেদ আছে।`,`- কাতার সোজা রাখা, প্রথম কাতার আগে পূর্ণ করা, কাঁধে কাঁধ মেলানো—হাদিসে গুরুত্ব দেওয়া হয়েছে।`,`- নারীর ওপর মসজিদের জামাত বাধ্যতামূলক নয়; ঘরেও নামাজ বৈধ। মসজিদে যাওয়ার বিধান নিয়ে ফকিহদের কিছু মতভেদ আছে।`],r:'সহিহ বুখারি ও মুসলিম (ইবনে উমর রা.); মতভেদ ফিকহে'},
{t:'ইমামের অনুসরণ',b:[
`নবী (সা.) বলেছেন, ইমাম নিযুক্ত করা হয় তাঁকে অনুসরণ করার জন্য; তিনি তাকবির বললে তোমরা তাকবির বলো, রুকু করলে রুকু করো (সহিহ বুখারি ও মুসলিম, আবু হুরায়রা রা.)।`,
`- ইমামের আগে কোনো রুকন (রুকু/সিজদা) শুরু করা বা শেষ করা উচিত নয়।`,`- ইমামের সঙ্গে সঙ্গে বা সামান্য পরে—যেন অনুসরণ স্পষ্ট হয়।`,`- ইমাম ভুল করলে পুরুষ মুক্তাদি “সুবহানাল্লাহ” বলে স্মরণ করাতে পারেন (সহিহ বুখারি ও মুসলিম, সাহল ইবনে সা‘দ রা.)।`,`- ইমামের কিরাত শুনে চুপ থাকা ও মনোযোগ দেওয়ার বিধানে (জেহরি নামাজে) মাজহাবভেদ আছে—পাঠ ১৪ দেখুন।`],r:'সহিহ বুখারি ও মুসলিম (আবু হুরায়রা; সাহল ইবনে সা‘দ রা.)'},
{t:'মাসবুকের নিয়ম',b:[
`মাসবুক হলেন যিনি ইমামের কিছু রাকাত চলে যাওয়ার পর জামাতে যোগ দেন।`,
`- মূল নীতি (সহিহ বুখারি ও মুসলিম, আবু হুরায়রা রা.): যতটুকু পাও ইমামের সাথে পড়ো, যা ছুটে গেছে তা পূরণ করো।`,`- ইমামকে যে অবস্থায় (কিয়াম/রুকু/সিজদা/বৈঠক) পাবেন সে অবস্থায় তাকবির দিয়ে শামিল হোন।`,`- ইমামের সালাম ফেরানোর পর সালাম না ফিরিয়ে দাঁড়িয়ে ছুটে যাওয়া রাকাত পূর্ণ করুন।`,`- রুকুতে শামিল হলে সেই রাকাত গণ্য হবে কি না: হানাফি, মালেকি ও হাম্বলি মতে রুকু পেলে রাকাত পেয়েছেন বলে ধরা হয়; কিছু আলেমের (যেমন ফাতিহা পড়া রুকন মনে করা মতে) ভিন্ন মত আছে।`,`- পূরণ করার সময় কোন রাকাতে কী পড়বেন (ফাতিহা/সূরা, কোথায় বসবেন)—এ খুঁটিনাটি মাজহাবভেদে ভিন্ন; নিশ্চিত হতে স্থানীয় আলেমের কাছে শিখুন।`],r:'সহিহ বুখারি ও মুসলিম (আবু হুরায়রা রা.); মতভেদ ফিকহে'},
{t:'নামাজে ভুল হলে করণীয়',b:[
`হানাফি ফিকহের সারকথা:`,
`- ফরজ ছুটে গেলে (যেমন রুকু বা সিজদা না করা, শেষ বৈঠক বাদ) যতক্ষণ সম্ভব তা আদায় করে নিন; সম্ভব না হলে নামাজ পুনরায় পড়তে হয়।`,`- ওয়াজিব ছুটে গেলে (যেমন ফাতিহা বাদ, প্রথম বৈঠক ভুলে ছেড়ে দেওয়া, ভুলে সূরা না মেলানো) সাহু সিজদা ওয়াজিব হয়।`,`- সুন্নত ছুটলে সাহু সিজদা লাগে না, তবে সওয়াব কমে যায়।`,`- ইচ্ছাকৃতভাবে ওয়াজিব ছাড়লে নামাজ পুনরায় পড়া ওয়াজিব হয়—হানাফি মত।`,`রাকাত সংখ্যায় সন্দেহ ও সাহু সিজদার পদ্ধতি পরের পাঠে দেখুন।`],r:'ফিকহের গ্রন্থসমূহ; মাজহাবভেদে পরিভাষা ও হুকুম ভিন্ন'},
{t:'সাহু সিজদা',b:[

{id:'tashahhud',t:'আত্তাহিয়্যাতু (তাশাহহুদ)',ar:'التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَىٰ عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ',tr:'আত্তাহিয়্যা-তু লিল্লা-হি ওয়াস্সালাওয়া-তু ওয়াত্তাইয়্যিবা-ত। আস্সালা-মু ‘আলাইকা আইয়্যুহান্নাবিয়্যু ওয়া রাহমাতুল্লা-হি ওয়া বারাকা-তুহ। আস্সালা-মু ‘আলাইনা- ওয়া ‘আলা- ‘ইবা-দিল্লা-হিস্সা-লিহীন। আশহাদু আল্লা- ইলা-হা ইল্লাল্লা-হু ওয়া আশহাদু আন্না মুহাম্মাদান ‘আবদুহূ ওয়া রাসূলুহ।',mean:'সব সম্মান, নামাজ ও পবিত্র বিষয় আল্লাহর জন্য। হে নবী, আপনার ওপর শান্তি এবং আল্লাহর রহমত ও বরকত বর্ষিত হোক। আমাদের ওপর এবং আল্লাহর নেক বান্দাদের ওপর শান্তি বর্ষিত হোক। আমি সাক্ষ্য দিচ্ছি আল্লাহ ছাড়া কোনো ইলাহ নেই, আর সাক্ষ্য দিচ্ছি মুহাম্মাদ (সা.) তাঁর বান্দা ও রাসূল।',when:'প্রতি বৈঠকে।',kind:'হানাফি: ওয়াজিব; শাফেয়ি/হাম্বলি: রুকন (শেষ বৈঠকে)',ref:'সহিহ বুখারি ও মুসলিম (ইবনে মাসউদ রা.)'},

async function srcFor(n,a){try{const r=await DB.get('audio',akey(n,a));if(r&&r.b)return{url:URL.createObjectURL(r.b),local:true}}catch(e){}
  return{url:(Pl.alt?audioAlt(n,a):null)||audioUrl(n,a),local:false}}
function setEl(i,s){if(Pl.urls[i])URL.revokeObjectURL(Pl.urls[i]);Pl.urls[i]=s.local?s.url:null;const el=A[i];el.src=s.url;el.defaultPlaybackRate=el.playbackRate=parseFloat($('#plSpeed').value);el.load()}

  if(Pl.cont&&Pl.a<Pl.end){const nk=Pl.n+':'+(Pl.a+1);
    if(Pl.pre&&Pl.pre.key===nk&&!Pl.pre.failed){const old=cur();ci^=1;Pl.a++;Pl.tok++;Pl.tries=0;Pl.alt=false;updInfo();markPlaying();Data.setLast(Pl.n,Pl.a);
      cur().play().catch(()=>loadCur(true));old.pause();Pl.pre=null}

function parseJump(s){s=bd2en(String(s)).trim();let m;
  if(m=s.match(/^(\d{1,3})$/)){const n=+m[1];return n>=1&&n<=114?`#/surah/${n}`:null}
  if(m=s.match(/^(\d{1,3})\s*[:.\-\/\s]\s*(\d{1,3})$/)){const n=+m[1],a=+m[2];return n>=1&&n<=114&&a>=1&&a<=SR[n-1].a?`#/surah/${n}/${a}`:null}
  const q=nz(s);if(q.length>=2){const h=SR.find(x=>nz(x.tl).includes(q)||nz(x.bn).includes(q));if(h)return `#/surah/${h.n}`}return null}
$('#jumpForm').onsubmit=e=>{e.preventDefault();const t=parseJump($('#jq').value);if(!t){toast('সঠিক সূরা:আয়াত লিখুন (যেমন ২:২৫৫); আয়াত নম্বর সূরার সীমার মধ্যে হতে হবে');return}$('#jq').value='';$('#histBox').hidden=true;$('#histBtn').setAttribute('aria-expanded','false');location.hash=t};
$('#histBtn').onclick=()=>{const b=$('#histBox'),o=b.hidden;if(o){const l=Data.hist();b.innerHTML=l.length?l.map(x=>`<a href="${esc(x.h)}">${esc(x.l)}</a>`).join(''):'<div class="src" style="padding:8px">এখনো কোনো ইতিহাস নেই।</div>'}b.hidden=!o;$('#histBtn').setAttribute('aria-expanded',o)};
$('#histBox').onclick=e=>{if(e.target.closest('a')){$('#histBox').hidden=true;$('#histBtn').setAttribute('aria-expanded','false')}};

async function vSurah(n,focus){
  if(!(n>=1&&n<=114)){view('<div class="errbox">সূরা নম্বর ১–১১৪ হতে হবে।</div>');return}
  const tk=RT,s=SR[n-1];Data.pushRecent(n);if(!Data.last()||Data.last().n!==n)Data.setLast(n,focus||1);
  Data.pushHist({h:`#/surah/${n}${focus?'/'+focus:''}`,l:`সূরা ${s.bn}${focus?' '+B(n)+':'+B(focus):''}`});
  view(`<div class="row sp noprint"><a class="btn alt sm" href="#/surahs">← সূরা তালিকা</a><span>${n>1?`<a class="btn alt sm" href="#/surah/${n-1}">← আগের সূরা</a>`:''} ${n<114?`<a class="btn alt sm" href="#/surah/${n+1}">পরের সূরা →</a>`:''}</span></div>
  <div class="card" style="text-align:center"><div class="ar c" lang="ar" style="font-size:calc(var(--ar-size)*1.2);line-height:1.6">${s.ar}</div><h2 class="pg" style="margin:0">${B(n)}. সূরা ${s.bn}</h2>
  <div><span class="chip">${esc(s.tl)}</span><span class="chip">${typeBn(s)}${DISP.includes(n)?' (মতভেদ আছে)':''}</span><span class="chip">${B(s.a)} আয়াত</span></div>
  <div class="row noprint" style="justify-content:center;margin-top:8px"><button class="btn" data-act="playall" data-n="${n}">▶ পুরো সূরা শুনুন</button><button class="btn alt" id="enBtn" aria-pressed="${P.en}">ইংরেজি ট্রান্সলিটারেশন</button><button class="btn alt" id="tjBtn" aria-pressed="${P.tj}">🎨 তাজবিদ রঙ</button><button class="btn alt" id="fcBtn">◎ বিক্ষেপমুক্ত পাঠ</button><a class="btn alt" href="#/tafsir/${n}">তাফসির ও পরিচিতি</a><a class="btn alt" href="#/downloads/${n}">⬇️ অফলাইন</a><a class="btn alt" href="#/hifz/${n}">🧠 হিফজ</a><button class="btn alt" id="prBtn">🖨 প্রিন্ট</button></div></div>
  <div id="sbody">${skel(4)}</div>`);
  $('#enBtn').onclick=async e=>{P.en=!P.en;savePrefs();e.currentTarget.setAttribute('aria-pressed',P.en);renderAyahs(n,await getEn(n),focus)};
  $('#tjBtn').onclick=async e=>{P.tj=!P.tj;savePrefs();e.currentTarget.setAttribute('aria-pressed',P.tj);await ensureTj(n);renderAyahs(n,await getEn(n),focus)};
  $('#fcBtn').onclick=()=>setFocus(true);$('#prBtn').onclick=()=>window.print();
  const data=await loadChapter(n);if(tk!==RT)return;
  window.__ch={n,data,tj:null,tjErr:null};
  await ensureTj(n);if(tk!==RT)return;
  renderAyahs(n,P.en?await getEn(n):null,focus);
}
async function ensureTj(n){const c=window.__ch;if(!c||c.n!==n||!P.tj||!c.data.ar||c.tj)return;
  try{c.tj=await loadTajweed(n,c.data.ar);c.tjErr=null}catch(e){c.tjErr=errMsg(e)}}
async function getEn(n){if(!P.en)return null;try{return await loadEnTranslit(n)}catch(e){toast('ইংরেজি ট্রান্সলিটারেশন লোড হয়নি: '+errMsg(e));return null}}
function tjLegend(h){const seen=new Map();(h||[]).forEach(x=>{(x.match(/data-r="([a-z_]+)"/g)||[]).forEach(m=>{const r=m.slice(8,-1);if(TJ[r])seen.set(TJ[r][0],TJ[r][1])})});
  return `<div class="card"><b>রঙের সূচক</b> <span class="src">(ডেটাসেট: Quran.com API v4 — <code>uthmani_tajweed</code>; শুধু রঙের ওপর নির্ভর না করে <a href="#/tajweed">তাজবিদ নিয়ম</a> দেখুন)</span><div class="tjleg" style="margin-top:6px">${[...seen].map(([k,v])=>`<span class="tj-${k}">${v}</span>`).join('')||'<span>এই সূরায় চিহ্নিত নিয়ম নেই</span>'}</div></div>`}
function renderAyahs(n,en,focus){
  const c=window.__ch&&window.__ch.n===n?window.__ch:null;if(!c||!$('#sbody'))return;const data=c.data;
  const s=SR[n-1],bm=Data.bm();let h='';
  if(data.err.length)h+=`<div class="errbox" role="alert"><b>লোড সমস্যা:</b><br>${data.err.map(esc).join('<br>')}<br><small>সংযোগ পরীক্ষা করে আবার চেষ্টা করুন। অডিও আলাদাভাবে কাজ করতে পারে।</small><br>${retryBtn('retrych','data-n="'+n+'"')}</div>`;

async function hydrateRec(root){
  if(!root)return;
  for(const el of root.querySelectorAll('.rec')){const r=REC_BY[el.dataset.rec];if(!r||!r.q)continue;const vb=el.querySelector('.vb');
    try{const [ch,f,t]=r.q;const d=await loadChapter(ch);
      if(!d.ar)throw new Error(d.err.join('; ')||'লোড হয়নি');
      el.querySelector('.rq').innerHTML=d.ar.slice(f-1,t).map(x=>esc(x)).join(' ');
      el.querySelector('.rm').innerHTML=d.tr?esc(d.tr.slice(f-1,t).join(' '))+`<br><span class="src">অনুবাদ: ${esc(d.trMeta.name)}</span>`:'<span class="src">অনুবাদ লোড হয়নি</span>';
      if(vb)vb.innerHTML=`<span class="vbadge ok">✔ আরবি সরাসরি লোড: সূরা ${B(ch)}:${B(f)}–${B(t)} · ${esc(d.src)}</span>`;
    }catch(e){const q=el.querySelector('.rq');if(q)q.innerHTML=`<span class="errbox" style="font-size:.7em;display:block;direction:ltr">আরবি টেক্সট লোড হয়নি (${esc(e.message||errMsg(e))}). একবার লোড বা ডাউনলোড হলে অফলাইনে থাকবে। <button class="btn sm" data-act="rerec">↻ আবার চেষ্টা</button></span>`;const m=el.querySelector('.rm');if(m)m.textContent='';if(vb)vb.innerHTML='<span class="vbadge bad">আরবি লোড হয়নি</span>'}}
}
/* কুরআনি দোয়ার টেক্সট API-র আয়াতের সাথে মেলানো (ডায়াক্রিটিক-নিরপেক্ষ) */
async function verifyQSnippet(ar,src){const m=bd2en(src).match(/(\d{1,3})\s*[:：]\s*(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?/);if(!m)return null;const n=+m[1],a=+m[2],b=+(m[3]||m[2]);
  try{const r=await getAr(n);const full=nz(r.ar.slice(a-1,b).join(' '));const snip=nz(ar);return{ok:full.includes(snip),ref:`${n}:${a}${b>a?'–'+b:''}`,src:r.src}}catch(e){return{err:errMsg(e)}}}

  <div id="dlist"></div>`);

}

const HF={n:1,f:1,t:7,reps:3,mode:'rand',lvl:50,seed:1,i:0,ar:null,run:false};
function hideHtml(text,key){const w=text.split(/\s+/).filter(Boolean);const can=w.map(x=>/[\u0621-\u064A\u0671-\u06D3]/.test(x));const idx=w.map((_,i)=>i).filter(i=>can[i]);const hid=new Set();
  const cnt=Math.max(1,Math.round(idx.length*HF.lvl/100));
  if(HF.mode==='all')idx.forEach(i=>hid.add(i));else if(HF.mode==='tail')idx.slice(idx.length-cnt).forEach(i=>hid.add(i));else if(HF.mode==='head')idx.slice(0,cnt).forEach(i=>hid.add(i));
  else if(HF.mode==='rand'){const rnd=mulberry(parseInt(fnv(key+':'+HF.seed),16));const pool=idx.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}pool.slice(0,cnt).forEach(i=>hid.add(i))}
  return w.map((x,i)=>`<span class="hw${hid.has(i)?' hid':''}${can[i]?'':' keep'}" ${hid.has(i)?'role="button" tabindex="0" aria-label="লুকানো শব্দ — দেখতে চাপুন"':''}>${esc(x)}</span>`).join(' ')}
function vHifz(p){

const distr=(pool,ans,k=3)=>shuffle(pool.filter(x=>x!==ans)).slice(0,k);
function genQuiz(type,N=10){const Q=[];
  if(type==='steps'){const S=buildSteps('two').filter(x=>x.r<=1);for(let i=0;i<S.length-1;i++){const ans=S[i+1].t;Q.push({q:`প্রথম রাকাতে “${S[i].t}”-এর পরের ধাপ কোনটি?`,c:shuffle([ans,...distr([...new Set(S.map(x=>x.t))],ans)]),a:ans})}}
  else if(type==='rakat'){Object.entries(PRAYERS).filter(([k])=>k!=='two').forEach(([k,p])=>{const ans=p.faraz;Q.push({q:`${p.n} নামাজের ফরজ কত রাকাত?`,c:shuffle([ans,...distr(['২ রাকাত ফরজ','৩ রাকাত ফরজ','৪ রাকাত ফরজ'],ans,2)]),a:ans})})}
  else if(type==='dua'){const pool=DUAS.map(d=>d.t);DUAS.forEach(d=>{const ans=d.t;if(Math.random()<.5)Q.push({q:'এই অর্থ কোন দোয়ার?',sub:d.mean,c:shuffle([ans,...distr(pool,ans)]),a:ans});else Q.push({q:'এই আরবি কোন দোয়ার?',ar:d.ar,c:shuffle([ans,...distr(pool,ans)]),a:ans})})}
  else if(type==='surah'){const names=SR.map(s=>'সূরা '+s.bn);
    for(let k=0;k<40;k++){const s=SR[Math.floor(Math.random()*114)],m=Math.floor(Math.random()*4);
      if(m===0){const ans='সূরা '+s.bn;Q.push({q:`কুরআনের ${B(s.n)} নম্বর সূরার নাম কী?`,c:shuffle([ans,...distr(names,ans)]),a:ans})}
      else if(m===1){const ans=String(s.n),pool=[...new Set([s.n-1,s.n+1,s.n+2,s.n-2,s.n+5].filter(x=>x>=1&&x<=114&&x!==s.n))].map(String);Q.push({q:`সূরা ${s.bn} কত নম্বর সূরা?`,c:shuffle([ans,...pool.slice(0,3)]).map(B),a:B(ans)})}
      else if(m===2&&s.n<114){const ans='সূরা '+SR[s.n].bn;Q.push({q:`সূরা ${s.bn}-এর পরের সূরা কোনটি?`,c:shuffle([ans,...distr(names,ans)]),a:ans})}
      else if(!DISP.includes(s.n)){const ans=typeBn(s);Q.push({q:`সূরা ${s.bn} কোন ধরনের (প্রচলিত তালিকা অনুযায়ী)?`,c:['মাক্কি','মাদানি'].map(x=>x),a:ans.includes('মাক্কি')?'মাক্কি':'মাদানি'})}}}
  return shuffle(Q).slice(0,N)}

const HJ_M=['মুহাররম','সফর','রবিউল আউয়াল','রবিউস সানি','জমাদিউল আউয়াল','জমাদিউস সানি','রজব','শা‘বান','রমজান','শাওয়াল','জিলকদ','জিলহজ'];
function hijri(d=new Date(),adj=0,cal='islamic-umalqura'){try{const dt=new Date(d.getFullYear(),d.getMonth(),d.getDate()+adj,12);
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-u-ca-'+cal+'-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(dt).map(x=>[x.type,x.value]));
  const r={d:+p.day,m:+p.month,y:parseInt(p.year)};return r.d&&r.m&&r.y?r:null}catch(e){return null}}
function hijriStr(d=new Date()){const c=Store.get('pt',{}),h=hijri(d,(c.hj&&c.hj.adj)||0,(c.hj&&c.hj.cal)||'islamic-umalqura');return h?`${B(h.d)} ${HJ_M[h.m-1]} ${B(h.y)} হিজরি`:'হিজরি তারিখ (এই ব্রাউজারে অনুপলব্ধ)'}

const PT_METHODS={karachi:{n:'University of Islamic Sciences, Karachi',f:18,i:18},mwl:{n:'Muslim World League',f:18,i:17},isna:{n:'ISNA (Islamic Society of North America)',f:15,i:15},egypt:{n:'Egyptian General Authority of Survey',f:19.5,i:17.5},makkah:{n:'Umm al-Qura, Makkah (এশা = মাগরিবের ৯০ মিনিট পরে)',f:18.5,im:90}};
const KAABA={lat:21.4225,lng:39.8262};
const CITIES={'ঢাকা':[23.8103,90.4125],'চট্টগ্রাম':[22.3569,91.7832],'রাজশাহী':[24.3745,88.6042],'খুলনা':[22.8456,89.5403],'সিলেট':[24.8949,91.8687],'বরিশাল':[22.7010,90.3535],'রংপুর':[25.7439,89.2752],'ময়মনসিংহ':[24.7471,90.4203],'মক্কা':[21.4225,39.8262],'মদিনা':[24.4672,39.6111]};
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),Bb=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+Bb-1524.5}
function ptCompute(date,lat,lng,tz,mk,asrF){
  const m=PT_METHODS[mk]||PT_METHODS.karachi,R=Math.PI/180;
  const sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),tan=x=>Math.tan(x*R),asin=x=>Math.asin(x)/R,acos=x=>Math.acos(x)/R,atan=x=>Math.atan(x)/R,atan2=(y,x)=>Math.atan2(y,x)/R,acot=x=>atan(1/x);
  const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a},fixH=a=>fix(a,24);
  const jd0=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-lng/(15*24);
  const sunPos=jd=>{const D=jd-2451545;const g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),L=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*D;const RA=atan2(cos(e)*sin(L),cos(L))/15;return{decl:asin(sin(e)*sin(L)),eqt:q/15-fixH(RA)}};
  const mid=t=>fixH(12-sunPos(jd0+t).eqt);
  const sat=(ang,t,ccw)=>{const dc=sunPos(jd0+t).decl;const x=(-sin(ang)-sin(dc)*sin(lat))/(cos(dc)*cos(lat));if(x>1||x<-1)return NaN;return mid(t)+(ccw?-1:1)*acos(x)/15};
  const asrT=(f,t)=>{const dc=sunPos(jd0+t).decl;return sat(-acot(f+tan(Math.abs(lat-dc))),t)};
  let t={fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,isha:18};
  for(let k=0;k<2;k++){const p=x=>x/24;t={fajr:sat(m.f,p(t.fajr),true),sunrise:sat(0.833,p(t.sunrise),true),dhuhr:mid(p(t.dhuhr)),asr:asrT(asrF,p(t.asr)),sunset:sat(0.833,p(t.sunset)),isha:m.im?NaN:sat(m.i,p(t.isha))};if(m.im)t.isha=t.sunset+m.im/60}
  const adj=tz-lng/15;const o={};for(const k in t)o[k]=t[k]+adj;o.maghrib=o.sunset;delete o.sunset;return o}
const PT={
  LIST:[['fajr','ফজর'],['dhuhr','যোহর'],['asr','আসর'],['maghrib','মাগরিব'],['isha','এশা']],
  cfg(){return Object.assign({method:'karachi',asr:'hanafi',lat:null,lng:null,name:'',tz:null,off:{},manual:{},useManual:false,notify:false,hj:{adj:0,cal:'islamic-umalqura'}},Store.get('pt',{}))},
  save(o){return Store.set('pt',Object.assign(this.cfg(),o))},
  times(date,c){c=c||this.cfg();date=date||new Date();
    const mins=k=>((c.off&&+c.off[k])||0)/60;const fin=t=>{const o={};for(const k in t)o[k]=t[k]==null||isNaN(t[k])?null:t[k]+mins(k);return o};
    const man=()=>{const o={};let any=false;for(const k of ['fajr','sunrise','dhuhr','asr','maghrib','isha']){const v=(c.manual||{})[k];if(v&&/^\d{1,2}:\d{2}$/.test(v)){const [h,mm]=v.split(':').map(Number);o[k]=h+mm/60;any=true}}return any?{src:'manual',t:o}:null};
    if(c.useManual)return man();
    if(c.lat==null||c.lng==null)return man();
    const tz=c.tz!=null&&c.tz!==''?+c.tz:-date.getTimezoneOffset()/60;
    const t=ptCompute(date,+c.lat,+c.lng,tz,c.method,c.asr==='hanafi'?2:1);
    if(['fajr','dhuhr','asr','maghrib','isha'].some(k=>isNaN(t[k])))return man()||{src:'fail',t:{}};
    const alt=ptCompute(date,+c.lat,+c.lng,tz,c.method,c.asr==='hanafi'?1:2).asr;
    return{src:'calc',t:fin(t),alt:isNaN(alt)?null:alt+mins('asr')}},
  next(c){c=c||this.cfg();const now=new Date(),nh=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;const r=this.times(now,c);if(!r||r.src==='fail')return null;
    for(const [k,nm] of this.LIST){const h=r.t[k];if(h!=null&&h>nh)return{k,nm,h,in:h-nh,day:0}}

   ========================================================= */
const nzs=s=>nz(s).replace(/ا/g,'');
async function vSearch(q){
  const tk=RT;q=(q||'').trim();view(`<h2 class="pg">সার্চ: “${esc(q)}”</h2><div id="sres">${skel(2)}</div>`);
  const nq=nz(q);if(nq.length<2&&!/^\d+$/.test(nq)){$('#sres').innerHTML='<div class="notice">অন্তত ২টি অক্ষর লিখুন।</div>';return}
  const jmp=parseJump(q);let h='';if(jmp)h+=`<div class="card row sp"><span>সরাসরি যান: <b>${esc(bd2en(q))}</b></span><a class="btn" href="${jmp}">যান →</a></div>`;
  const isAr=/[\u0621-\u064A]/.test(nq),nqa=nzs(nq),nqs=nq.replace(/ /g,'');const hit=(txt,sp)=>{const t=nz(txt);return t.includes(nq)||(isAr&&nzs(t).includes(nqa))||(sp&&t.replace(/ /g,'').includes(nqs))};
  const sur=SR.filter(s=>String(s.n)===nq||hit(s.tl,1)||hit(s.bn,1)||hit(s.ar,1));
  if(sur.length)h+=`<h3>সূরা (${B(sur.length)})</h3><div class="sgrid">${sur.slice(0,30).map(s=>surahRow(s)).join('')}</div>`;
  const snip=(lines)=>{const l=lines.find(x=>nz(x).includes(nq));return l?esc(l.length>140?l.slice(0,140)+'…':l):''};

function showHelp(){const d=$('#dlg');const rows=[['/','সার্চে যান'],['g','সূরা:আয়াতে যান'],['j / k','পরের / আগের আয়াত'],['b','বর্তমান আয়াত বুকমার্ক'],['p','অডিও চালান/থামান'],['f','বিক্ষেপমুক্ত মোড'],['t','থিম বদলান'],['h','হোম'],['?','এই সাহায্য'],['Esc','বন্ধ করুন']];
  if(typeof d.showModal!=='function'){alert(rows.map(r=>r.join(' — ')).join('\n'));return}
  d.innerHTML=`<form method="dialog"><h2 id="dlgTitle" class="pg" style="margin-top:0">কীবোর্ড শর্টকাট</h2><table style="width:100%">${rows.map(r=>`<tr><td style="padding:4px"><kbd>${r[0]}</kbd></td><td>${r[1]}</td></tr>`).join('')}</table><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" value="ok">বন্ধ</button></div></form>`;d.showModal()}
$('#helpBtn').onclick=showHelp;
let ayi=-1;
function ayMove(dir){const cs=[...document.querySelectorAll('.ayah')];if(!cs.length)return;const cur=document.activeElement&&document.activeElement.closest?document.activeElement.closest('.ayah'):null;let i=cur?cs.indexOf(cur):ayi;i=Math.max(0,Math.min(cs.length-1,(i<0?(dir>0?0:0):i+dir)));ayi=i;const c=cs[i];c.setAttribute('tabindex','-1');c.focus({preventScroll:true});c.scrollIntoView({block:'center',behavior:P.motion==='reduce'?'auto':'smooth'})}
document.addEventListener('keydown',e=>{
  const t=e.target,typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
  if(e.key==='Escape'){if(document.documentElement.classList.contains('focus'))setFocus(false);if(!$('#histBox').hidden){$('#histBox').hidden=true;$('#histBtn').setAttribute('aria-expanded','false')}{const was=$('#nav').classList.contains('open');openMenu(false,was)};return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if((e.key==='Enter'||e.key===' ')&&t.classList&&t.classList.contains('hw')){e.preventDefault();t.classList.toggle('hid');return}
  if((e.key==='Enter'||e.key===' ')&&t.classList&&t.classList.contains('flash')){e.preventDefault();t.click();return}
  switch(e.key){
   case '/':e.preventDefault();$('#q').focus();break;
   case 'g':e.preventDefault();$('#jq').focus();break;
   case 'j':ayMove(1);break;case 'k':ayMove(-1);break;
   case 'b':{const c=document.activeElement.closest&&document.activeElement.closest('.ayah');const bt=c&&c.querySelector('[data-act=bm]');if(bt)bt.click();break}
   case 'p':if(!$('#player').hidden||Pl.n)$('#plPlay').click();break;
   case 'f':setFocus(!document.documentElement.classList.contains('focus'));break;
   case 't':$('#themeBtn').click();break;
   case 'h':location.hash='#/home';break;
   case '?':showHelp();break}});
document.addEventListener('click',e=>{
  const hw=e.target.closest('.hw.hid');if(hw){hw.classList.remove('hid');return}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,card=b.closest('.ayah');
  const hist=()=>{if(card)Data.pushHist({h:`#/surah/${card.dataset.n}/${card.dataset.a}`,l:`সূরা ${SR[card.dataset.n-1].bn} ${B(card.dataset.n)}:${B(card.dataset.a)}`})};
  switch(act){
   case 'play':hist();startPlay(+card.dataset.n,+card.dataset.a);break;
   case 'rep':Pl.repeat=true;$('#plRep').setAttribute('aria-pressed','true');startPlay(+card.dataset.n,+card.dataset.a,+card.dataset.a);toast('এই আয়াত বারবার চলবে (প্লেয়ারে বন্ধ করা যায়)');break;
   case 'playall':Pl.repeat=false;$('#plRep').setAttribute('aria-pressed','false');startPlay(+b.dataset.n,1);break;
   case 'bm':{hist();const k=card.dataset.n+':'+card.dataset.a;const on=Data.toggleBm(k);b.textContent=on?'★ বুকমার্কড':'☆ বুকমার্ক';b.setAttribute('aria-pressed',on);if(!Store.ok)toast('স্টোরেজ বন্ধ—শুধু এই সেশনে থাকবে');break}
   case 'copy':copyText(card.querySelector('.ar').textContent);break;
   case 'tafsir':case 'shan':case 'note':case 'words':openPanel(card,act);break;
   case 'savenote':{const k=card.dataset.n+':'+card.dataset.a;Data.setNote(k,card.querySelector('textarea').value);toast('নোট সেভ হয়েছে');card.querySelector('[data-act=note]').textContent=card.querySelector('textarea').value.trim()?'📝 নোট (আছে)':'📝 নোট';break}
   case 'last':hist();Data.setLast(+card.dataset.n,+card.dataset.a);toast('এই আয়াতে থামার চিহ্ন রাখা হয়েছে');break;
   case 'read':{const ok=Act.mark(+card.dataset.n,+card.dataset.a);toast(ok?`আজকের গণনায় যোগ হয়েছে (${B(Act.count())})`:'এই আয়াত আজ আগেই গণনা হয়েছে');break}
   case 'tfsel':P.tf=+b.value;savePrefs();card.querySelector('.panel').hidden=true;card.querySelector('.panel').dataset.kind='';openPanel(card,'tafsir');break;
   case 'retrypanel':{const pn=b.closest('.panel');const kind=b.dataset.kind||pn.dataset.kind;pn.dataset.kind='';openPanel(card,kind);break}
   case 'retrych':case 'retrytj':case 'rerec':case 'rerule':case 'hfretry':route();break;
   case 'tgoretry':$('#tgo').click();break;
   case 'qpick':setQari(b.dataset.id);startPlay(1,1,7);break;
   case 'recplay':{const r=REC_BY[b.dataset.id];startPlay(r.q[0],r.q[1],r.q[2]);break}
   case 'copyrec':{const r=REC_BY[b.dataset.id];const el=b.closest('.rec').querySelector('.ar');copyText(r.ar||el.textContent);break}
   case 'copytxt':copyText(b.dataset.t);break;
   case 'memtog':Data.toggleMem(b.dataset.id);{const on=Data.mem()[b.dataset.id];b.textContent=on?'মুখস্থ বাতিল':'✔ মুখস্থ হয়েছে';toast(on?'মুখস্থ চিহ্নিত':'চিহ্ন সরানো হয়েছে')}break;
   case 'practice':b.closest('.rec').classList.toggle('blur');break;
   case 'theme':P.theme=b.dataset.v;savePrefs();applyPrefs();document.querySelectorAll('[data-act=theme]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===P.theme));break;
   case 'print':window.print();break;
   case 'shortcuts':showHelp();break;
   case 'report':openReport(b.dataset.kind,b.dataset.id,b.dataset.title);break;
   case 'review':openReview(b.dataset.key,b.dataset.title);break;
   case 'repdel':Rep.del(b.dataset.id);vReports();break;
   case 'tjtoggle':P.tj=!P.tj;savePrefs();vTajweed();break;
   /* হিফজ */
   case 'hfplay':startPlay(HF.n,HF.f+HF.i,HF.f+HF.i,{reps:HF.reps});break;
   case 'hfplayall':startPlay(HF.n,HF.f,HF.t,{reps:HF.reps});break;
   case 'hfreveal':HF.reveal=!HF.reveal;drawHifz();break;
   case 'hfreseed':HF.seed++;HF.reveal=false;drawHifz();break;
   case 'hfprev':HF.i=Math.max(0,HF.i-1);HF.reveal=false;drawHifz();break;
   case 'hfnext':HF.i++;HF.reveal=false;drawHifz();break;
   case 'hffinish':hifzFinish();break;
   case 'hfgrade':{const it=Hifz.grade(HF.n,HF.f,HF.t,+b.dataset.q);toast(it.int?`পরের রিভিশন ${B(it.int)} দিন পরে`:'আজই আবার রিভিশন হবে');if(location.hash==='#/hifz')route();else location.hash='#/hifz';break}
   case 'hfdel':Hifz.del(b.dataset.k);route();break;
   /* কুইজ */
   case 'qopt':{const q=QZ.qs[QZ.i],ch=q.c[+b.dataset.i],ok=ch===q.a;if(ok)QZ.score++;
     b.closest('[role=group]').querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.c[+x.dataset.i]===q.a)x.classList.add('good')});if(!ok)b.classList.add('badc');

   case 'qnext':QZ.i++;drawQuiz();break;
   case 'flip':QZ.flip=!QZ.flip;drawFlash();break;
   case 'fknow':QZ.score++;QZ.i++;QZ.flip=false;drawFlash();break;
   case 'fagain':QZ.i++;QZ.flip=false;drawFlash();break;
   /* চেকলিস্ট ও লক্ষ্য */
   case 'chknext':{const key=$('#cSel').value,S=buildSteps(key);chkWrite(key,st=>{const i=S.findIndex((x,ix)=>!st.s.includes(ix));if(i>=0)st.s.push(i)});vChecklist(key);const c=document.querySelector('.chk.cur');if(c)c.scrollIntoView({block:'center'});break}
   case 'chkreset':{const key=$('#cSel').value;chkWrite(key,st=>{st.s=[];st.u=[]});vChecklist(key);toast('রিসেট হয়েছে');break}
   case 'plandone':{const pl=Store.get('plan',null);if(pl){pl.done=pl.done||{};const d=b.dataset.d;if(pl.done[d])delete pl.done[d];else pl.done[d]=1;Store.set('plan',pl);vGoals()}break}
   case 'planreset':if(confirm('পড়ার পরিকল্পনা বাতিল করবেন?')){Store.del('plan');vGoals()}break;
   /* ডাউনলোড */
   case 'dlsurah':{const n=+b.dataset.n;dlRun(`সূরা ${SR[n-1].bn}`,()=>dlSurah(n,dlOpts()));break}
   case 'dldel':{const n=+b.dataset.n;if(confirm(`সূরা ${SR[n-1].bn}-এর ডাউনলোড (টেক্সট, অনুবাদ, সব ক্বারির অডিও) মুছবেন?`))dlDelete(n).then(()=>{toast('মুছে ফেলা হয়েছে');route()});break}
   case 'dlcancel':DL.cancel=true;toast('বাতিল হচ্ছে…');break;
   case 'dlpersist':{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(ok=>toast(ok?'স্থায়ী স্টোরেজ মঞ্জুর হয়েছে':'ব্রাউজার স্থায়ী স্টোরেজ মঞ্জুর করেনি'));else toast('এই ব্রাউজারে সুবিধাটি নেই');break}

   case 'dljuz':{const jn=+$('#juzSel').value,o=dlOpts();dlRun(`পারা ${B(jn)}`,async()=>{dlP('পারার তালিকা লোড হচ্ছে…');const l=await juzList();const j=l.find(x=>x.n===jn);if(!j)throw new Error('পারা পাওয়া যায়নি');const w=[];
     for(const k of Object.keys(j.m)){if(DL.cancel)break;const [a,b2]=String(j.m[k]).split('-').map(Number);w.push(...await dlSurah(+k,Object.assign({},o,{from:a,to:b2})))}return w});break}
   case 'dlalltext':dlRun('পুরো কুরআনের টেক্সট',async()=>{const w=[];for(let n=1;n<=114;n++){if(DL.cancel)break;dlP(`সূরা ${SR[n-1].bn} (${B(n)}/১১৪)…`,n/114*100);try{await getAr(n);await getTr(n)}catch(e){w.push(`সূরা ${n}: ${e.message||errMsg(e)}`);if(isQuota(e))throw e}}return w.slice(0,10)});break;
   case 'clear':if(confirm('সব বুকমার্ক, নোট, অগ্রগতি, ডাউনলোড ও ক্যাশ মুছে যাবে। নিশ্চিত? (আগে ব্যাকআপ নিয়ে রাখতে পারেন)')){Store.clear();DB.clearAll().catch(()=>{}).then(()=>{for(const k in MEM)delete MEM[k];try{if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}catch(e){}toast('মুছে ফেলা হয়েছে');setTimeout(()=>location.reload(),700)})}break;
  }
});
